  var ss = useState("partidos"); var adminSection = ss[0]; var setAdminSection = ss[1];
  var sl = useState(null); var sel = sl[0]; var setSel = sl[1];
  var dt = useState("partidos"); var dTab = dt[0]; var setDTab = dt[1];
  var ar = useReducer(adR, null, function() {
    try { return JSON.parse(localStorage.getItem("porra26v7") || "null") || INIT; } catch(ex) { return INIT; }
  });
  var ad = ar[0]; var dispatch = ar[1];
  var kr = ad.knockoutResults || {};

  useEffect(function() { localStorage.setItem("porra26v7", JSON.stringify(ad)); }, [ad]);

  var scores = useMemo(function() {
    return Object.entries(PD).map(function(x) {
      var res = calcPts(x[1], ad);
      return {name: x[0], total: res.total, breakdown: res.breakdown};
    }).sort(function(a, b) { return b.total - a.total; });
  }, [ad]);

  var md = Object.keys(ad.matches).length;

  if (view === "ranking" && !sel) {
    return h(RankingView, {scores:scores, md:md, setSel:setSel, setDTab:setDTab, view:view, setView:setView});
  }
  if (view === "ranking" && sel) {
    return h(DetailView, {sel:sel, ad:ad, kr:kr, dTab:dTab, setDTab:setDTab, setSel:setSel, view:view, setView:setView});
  }
  if (view === "admin") {
    if (!adminAuth) return h(AdminLogin, {setAdminAuth:setAdminAuth, view:view, setView:setView, setSel:setSel});
    return h(AdminView, {ad:ad, dispatch:dispatch, kr:kr, adminSection:adminSection, setAdminSection:setAdminSection, view:view, setView:setView, setSel:setSel});
  }

  if(view==="info"){
    var pts=[
      {ico:"⚽",title:"Fase de grupos",lines:["2 pts por acertar el signo (1/X/2)","+1 pt adicional por resultado exacto"]},
      {ico:"📊",title:"Posición en grupos",lines:["2 pts por cada posición acertada en su grupo"]},
      {ico:"1/16",title:"Clasificados para 1/16",lines:["5 pts por cada equipo acertado"]},
      {ico:"1/8",title:"Clasificados para 1/8",lines:["10 pts por cada equipo acertado"]},
      {ico:"1/4",title:"Clasificados para cuartos",lines:["20 pts por cada equipo acertado"]},
      {ico:"1/2",title:"Clasificados para semis",lines:["40 pts por cada equipo acertado"]},
      {ico:"🏟️",title:"Finalistas",lines:["40 pts por cada finalista acertado"]},
      {ico:"🏆",title:"Campeón",lines:["80 pts por acertar el campeón"]},
      {ico:"🥉",title:"3er puesto",lines:["20 pts por acertar el 3er clasificado"]},
      {ico:"👟",title:"Botas",lines:["15 pts — Bota de Oro","10 pts — Bota de Plata","5 pts — Bota de Bronce"]},
      {ico:"🏅",title:"Balones",lines:["15 pts — Balón de Oro","10 pts — Balón de Plata","5 pts — Balón de Bronce"]}
    ];
    return h("div",{style:{display:"flex",flexDirection:"column",minHeight:"100vh"}},
      h("div",{style:{flex:1,overflowY:"auto"}},
        h("div",{style:{background:"linear-gradient(135deg,#111827,#1e3a5f)",padding:"26px 16px 18px",textAlign:"center"}},
          h("div",{style:{fontSize:40,marginBottom:4}},"📋"),
          h("h1",{style:{color:"#f59e0b",fontSize:21,fontWeight:900,margin:0}},"Sistema de puntuacion")
        ),
        h("div",{style:{maxWidth:500,margin:"0 auto",padding:"12px 12px 80px"}},
          pts.map(function(s){
            return h("div",{key:s.title,style:{background:"#161f2e",borderRadius:12,padding:"14px 16px",marginBottom:8}},
              h("div",{style:{display:"flex",alignItems:"center",gap:10,marginBottom:8}},
                s.ico.length<=4?h("span",{style:{fontSize:22}},s.ico):h("span",{style:{background:"#1e3a5f",color:"#60a5fa",borderRadius:6,padding:"2px 8px",fontSize:12,fontWeight:700}},s.ico),
                h("span",{style:{fontWeight:700,color:"#f5f5f5",fontSize:14}},s.title)
              ),
              s.lines.map(function(l,i){
                return h("div",{key:i,style:{display:"flex",alignItems:"flex-start",gap:8,marginBottom:4}},
                  h("span",{style:{color:"#f59e0b",fontSize:12}},"•"),
                  h("span",{style:{color:"#c0d4e8",fontSize:13}},l)
                );
              })
            );
          })
        )
      ),
      h(Nav,{view:view,setView:setView,setSel:setSel})
    );
  }
  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App, null));

</script>
</body>
