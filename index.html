function calcPts(pl,ad){
  var p=0,b={partidos:0,posiciones:0,r32:0,r16:0,qf:0,sf:0,final_:0,campeon:0,tercero:0,botas:0,balones:0};

  var kr=ad.knockoutResults||{};
  var rR32=Object.entries(ad.teamR32||{}).filter(function(x){return x[1];}).map(function(x){return x[0];});
  (pl.r32||[]).forEach(function(t){if(rR32.indexOf(t)>=0){p+=5;b.r32+=5;}});
  var rR16=Array.from({length:16},function(_,i){return 73+i;}).map(function(n){return kr[n];}).filter(Boolean);
  (pl.r16||[]).forEach(function(t){if(rR16.indexOf(t)>=0){p+=10;b.r16+=10;}});
  var rQF=R16B.map(function(b){return kr[b.n];}).filter(Boolean);
  (pl.qf||[]).forEach(function(t){if(rQF.indexOf(t)>=0){p+=20;b.qf+=20;}});
  var rSF=QFB.map(function(b){return kr[b.n];}).filter(Boolean);
  (pl.sf||[]).forEach(function(t){if(rSF.indexOf(t)>=0){p+=40;b.sf+=40;}});
  (pl.final||[]).forEach(function(t){if(t===kr[101]||t===kr[102]){p+=40;b.final_+=40;}});
  if(kr[104]&&pl.champion===kr[104]){p+=80;b.campeon+=80;}
  if(ad.thirdDone&&kr[103]&&pl.third===kr[103]){p+=20;b.tercero+=20;}
  if(ad.bootsDone){if(pl.goldenBoot===ad.goldenBoot){p+=15;b.botas+=15;}if(pl.silverBoot===ad.silverBoot){p+=10;b.botas+=10;}if(pl.bronzeBoot===ad.bronzeBoot){p+=5;b.botas+=5;}}

  return{total:p,breakdown:b};
}

function adR(state,action){
  if(action.type==="SET_MATCH")return Object.assign({},state,{matches:Object.assign({},state.matches,{[action.match]:action.value})});
  if(action.type==="SET_FIELD")return Object.assign({},state,{[action.field]:action.value});
  if(action.type==="SET_GP"){var gp=Object.assign({},state.groupPositions);var arr=(gp[action.g]||["","","",""]).slice();arr[action.i]=action.v;gp[action.g]=arr;return Object.assign({},state,{groupPositions:gp});}
  if(action.type==="SET_TEAM_R32")return Object.assign({},state,{teamR32:Object.assign({},state.teamR32,{[action.team]:action.value})});
  if(action.type==="SET_TEAM_GAME")return Object.assign({},state,{teamGame:Object.assign({},state.teamGame,{[action.team]:action.value})});
  if(action.type==="SET_KR")return Object.assign({},state,{knockoutResults:Object.assign({},state.knockoutResults,{[action.n]:action.v})});
  if(action.type==="RESET")return INIT;
  return state;
}
