function PieChart(props){
  var data=props.data,n=props.n,size=props.size||120;
  if(!data||data.length===0)return null;
  var total=data.reduce(function(s,x){return s+x[1];},0);
  var colors=["#f59e0b","#3b82f6","#22c55e","#ef4444","#8b5cf6","#06b6d4","#f97316","#ec4899","#84cc16","#a855f7","#14b8a6","#f43f5e","#eab308","#6366f1","#78716c"];
  var slices=[]; var cum=0;
  var cx=size/2,cy=size/2,r=size/2-2;
  data.forEach(function(item,i){
    var pct=item[1]/total;
    var startA=cum*2*Math.PI-Math.PI/2;
    var endA=(cum+pct)*2*Math.PI-Math.PI/2;
    var x1=cx+r*Math.cos(startA),y1=cy+r*Math.sin(startA);
    var x2=cx+r*Math.cos(endA),y2=cy+r*Math.sin(endA);
    var large=pct>0.5?1:0;
    var d="M"+cx+","+cy+" L"+x1.toFixed(2)+","+y1.toFixed(2)+" A"+r+","+r+" 0 "+large+",1 "+x2.toFixed(2)+","+y2.toFixed(2)+" Z";
    slices.push({d:d,color:colors[i%colors.length],item:item,pct:pct});
    cum+=pct;
  });
  return h("div",null,
    h("div",{style:{display:"flex",justifyContent:"center",marginBottom:12}},
      h("svg",{width:size,height:size},slices.map(function(s,i){return h("path",{key:i,d:s.d,fill:s.color,stroke:"#0d1117",strokeWidth:1});}))
    ),
    h("div",null,slices.map(function(s,i){
      var pct=Math.round(s.item[1]/n*100);
      var flag=FLAGS[s.item[0]]||"";
      return h("div",{key:i,style:{display:"flex",alignItems:"center",gap:8,marginBottom:5}},
        h("div",{style:{width:10,height:10,borderRadius:2,background:s.color,flexShrink:0}}),
        h("span",{style:{fontSize:14}},flag),
        h("span",{style:{fontSize:12,color:"#c0d4e8",flex:1}},s.item[0]),
        h("span",{style:{fontSize:12,color:"#f59e0b",fontWeight:700,minWidth:28,textAlign:"right"}},s.item[1]),
        h("span",{style:{fontSize:11,color:"#4b6a8a",minWidth:36,textAlign:"right"}},"("+pct+"%)")
      );
    }))
  );
}

function FinalPairs(props){
  var data=props.data,n=props.n;
  if(!data||data.length===0)return null;
  var max=data[0][1];
  var colors=["#f59e0b","#3b82f6","#22c55e","#ef4444","#8b5cf6","#06b6d4","#f97316","#ec4899","#84cc16","#a855f7"];
  return h("div",{style:{width:"100%"}},
    data.map(function(item,i){
      var pct=Math.round(item[1]/n*100);
      var barW=Math.round(item[1]/max*100);
      var teams=item[0].split(" - ");
      var f1=FLAGS[teams[0]]||"",f2=FLAGS[teams[1]]||"";
      return h("div",{key:item[0],style:{marginBottom:10}},
        h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}},
          h("span",{style:{fontSize:12,color:"#c0d4e8",fontWeight:600}},f1+" "+teams[0]+" vs "+teams[1]+" "+f2),
          h("span",{style:{fontSize:11,color:"#4b6a8a"}},item[1]+" ("+pct+"%)")
        ),
        h("div",{style:{background:"#1e2a3a",borderRadius:4,height:8,overflow:"hidden"}},
          h("div",{style:{background:colors[i%colors.length],width:barW+"%",height:"100%",borderRadius:4}})
        )
      );
    })
  );
}

function CollapsibleSection(props){
  var label=props.label,color=props.color,children=props.children;
  var op=useState(false),open=op[0],setOpen=op[1];
  return h("div",{style:{marginBottom:8}},
    h("div",{onClick:function(){setOpen(!open);},style:{background:"#161f2e",borderRadius:open?"12px 12px 0 0":"12px",padding:"13px 16px",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between"}},
      h("span",{style:{fontWeight:700,color:color||"#f5f5f5",fontSize:13}},label),
      h("span",{style:{color:"#4b6a8a",fontSize:14}},open?"▲":"▼")
    ),
    open&&h("div",{style:{background:"#1a2535",borderRadius:"0 0 12px 12px",padding:"14px 16px",borderTop:"1px solid #1e2a3a"}},children)
  );
}

function MatchStatsRow(props){
  var m=props.match,s=props.stats,n=props.n;
  var expanded=props.expanded,onToggle=props.onToggle;
  var v1=s["1"]||0,vx=s["X"]||0,v2=s["2"]||0;
  var parts=m.split("-");
  var home=parts[0],away=parts.slice(1).join("-");
  var fh=FLAGS[home]||"",fa=FLAGS[away]||"";
  return h("div",{style:{marginBottom:6}},
    h("div",{onClick:onToggle,style:{background:"#161f2e",borderRadius:expanded?"10px 10px 0 0":"10px",padding:"10px 14px",cursor:"pointer",display:"flex",alignItems:"center",gap:8}},
      h("div",{style:{flex:1}},
        h("div",{style:{fontSize:12,color:"#c0d4e8",fontWeight:600,marginBottom:4}},fh+" "+home+" — "+fa+" "+away),
        h("div",{style:{display:"flex",gap:1,borderRadius:4,overflow:"hidden",height:14}},
          v1>0?h("div",{style:{flex:v1,background:"#3b82f6"}}):null,
          vx>0?h("div",{style:{flex:vx,background:"#6b7280"}}):null,
          v2>0?h("div",{style:{flex:v2,background:"#ef4444"}}):null
        )
      ),
      h("span",{style:{color:"#4b6a8a",fontSize:12}},expanded?"▲":"▼")
    ),
    expanded&&h("div",{style:{background:"#1a2535",borderRadius:"0 0 10px 10px",padding:"12px 14px",borderTop:"1px solid #1e2a3a"}},
      h("div",{style:{display:"flex",gap:0,marginBottom:10}},
        h("div",{style:{flex:1,textAlign:"center",padding:"8px 4px",background:"#1e3a5f",borderRadius:"6px 0 0 6px"}},
          h("div",{style:{fontSize:22,fontWeight:900,color:"#3b82f6"}},v1),
          h("div",{style:{fontSize:10,color:"#60a5fa"}},"Victoria "+fh),
          h("div",{style:{fontSize:11,color:"#4b6a8a"}},Math.round(v1/n*100)+"%")
        ),
        h("div",{style:{flex:1,textAlign:"center",padding:"8px 4px",background:"#2a3a4a"}},
          h("div",{style:{fontSize:22,fontWeight:900,color:"#9ca3af"}},vx),
          h("div",{style:{fontSize:10,color:"#c0d4e8"}},"Empate"),
          h("div",{style:{fontSize:11,color:"#4b6a8a"}},Math.round(vx/n*100)+"%")
        ),
        h("div",{style:{flex:1,textAlign:"center",padding:"8px 4px",background:"#3a1f1f",borderRadius:"0 6px 6px 0"}},
          h("div",{style:{fontSize:22,fontWeight:900,color:"#ef4444"}},v2),
          h("div",{style:{fontSize:10,color:"#fca5a5"}},"Victoria "+fa),
          h("div",{style:{fontSize:11,color:"#4b6a8a"}},Math.round(v2/n*100)+"%")
        )
      ),
      s.scores&&s.scores.length>0&&h("div",null,
        h("div",{style:{fontSize:10,color:"#4b6a8a",marginBottom:6,textTransform:"uppercase",letterSpacing:1}},"Resultados más votados"),
        h("div",{style:{display:"flex",flexWrap:"wrap",gap:6}},
          s.scores.map(function(sc){return h("span",{key:sc[0],style:{background:"#1e2a3a",borderRadius:6,padding:"4px 10px",fontSize:12,color:"#c0d4e8",fontWeight:600}},sc[0]," ",h("span",{style:{color:"#4b6a8a",fontSize:11}},sc[1]));})
        )
      )
    )
  );
}

function StatsView(props){
  var view=props.view,setView=props.setView,setSel=props.setSel;
  var ts=useState("campeon"),sTab=ts[0],setSTab=ts[1];
  var ex=useState(null),expanded=ex[0],setExpanded=ex[1];
  var n=STATS.n;
  var tabs=[{k:"campeon",label:"Final"},{k:"rondas",label:"Rondas"},{k:"premios",label:"Premios"},{k:"partidos",label:"Partidos"}];
  var content=null;
  if(sTab==="campeon"){
    content=h("div",{style:{paddingBottom:80}},
      h(CollapsibleSection,{label:"🏆 ¿Quién será campeón?",color:"#f59e0b"},h(PieChart,{data:STATS.champion,n:n,size:150})),
      h(CollapsibleSection,{label:"🥈 ¿Quién será segundo?",color:"#9ca3af"},h(PieChart,{data:STATS.runnerUp,n:n,size:150})),
      h(CollapsibleSection,{label:"🏟️ Finales más repetidas",color:"#60a5fa"},h(FinalPairs,{data:STATS.finalPairs,n:n})),
      h(CollapsibleSection,{label:"🥉 ¿Quién ganará el tercer puesto?",color:"#b45309"},h(PieChart,{data:STATS.third,n:n,size:150}))
    );
  } else if(sTab==="rondas"){
    content=h("div",{style:{paddingBottom:80}},
      h(CollapsibleSection,{label:"🔵 Semifinalistas",color:"#3b82f6"},h(PieChart,{data:STATS.sf,n:n,size:140})),
      h(CollapsibleSection,{label:"🟣 Cuartofinalistas",color:"#8b5cf6"},h(PieChart,{data:STATS.qf,n:n,size:140})),
      h(CollapsibleSection,{label:"🟢 Clasificados para 1/8",color:"#22c55e"},h(PieChart,{data:STATS.r16,n:n,size:140})),
      h(CollapsibleSection,{label:"⚪ Clasificados para 1/16",color:"#9ca3af"},h(PieChart,{data:STATS.r32,n:n,size:140}))
    );
  } else if(sTab==="premios"){
    content=h("div",{style:{paddingBottom:80}},
      h(CollapsibleSection,{label:"👟 Bota de Oro",color:"#f59e0b"},h(PieChart,{data:STATS.goldenBoot,n:n,size:130})),
      h(CollapsibleSection,{label:"👟 Bota de Plata",color:"#9ca3af"},h(PieChart,{data:STATS.silverBoot,n:n,size:130})),
      h(CollapsibleSection,{label:"👟 Bota de Bronce",color:"#b45309"},h(PieChart,{data:STATS.bronzeBoot,n:n,size:130})),
      h(CollapsibleSection,{label:"🏅 Balón de Oro",color:"#f59e0b"},h(PieChart,{data:STATS.goldenBall,n:n,size:130})),
      h(CollapsibleSection,{label:"🏅 Balón de Plata",color:"#9ca3af"},h(PieChart,{data:STATS.silverBall,n:n,size:130})),
      h(CollapsibleSection,{label:"🏅 Balón de Bronce",color:"#b45309"},h(PieChart,{data:STATS.bronzeBall,n:n,size:130}))
    );
  } else if(sTab==="partidos"){
    content=h("div",{style:{paddingBottom:80}},
      h("div",{style:{fontSize:11,color:"#60a5fa",marginBottom:10,padding:"8px 12px",background:"#1e2a3a",borderRadius:8}},"Pulsa en un partido para ver el desglose de pronósticos"),
      Object.keys(STATS.matches).map(function(m){return h(MatchStatsRow,{key:m,match:m,stats:STATS.matches[m],n:n,expanded:expanded===m,onToggle:function(){setExpanded(expanded===m?null:m);}});})
    );
  }
  return h("div",{style:{display:"flex",flexDirection:"column",minHeight:"100vh"}},
    h("div",{style:{flex:1,overflowY:"auto"}},
      h("div",{style:{background:"linear-gradient(135deg,#111827,#1e3a5f)",padding:"20px 16px 14px",textAlign:"center"}},
        h("div",{style:{fontSize:36,marginBottom:2}},"📈"),
        h("h1",{style:{color:"#f59e0b",fontSize:19,fontWeight:900,margin:0}},"Estadísticas")
      ),
      h("div",{style:{display:"flex",borderBottom:"1px solid #1e2a3a",background:"#111827",position:"sticky",top:0,zIndex:10}},
        tabs.map(function(t){return h("button",{key:t.k,onClick:function(){setSTab(t.k);setExpanded(null);},style:{flex:1,padding:"10px 2px",background:"none",border:"none",borderBottom:sTab===t.k?"2px solid #f59e0b":"2px solid transparent",color:sTab===t.k?"#f59e0b":"#4b6a8a",fontSize:10,fontWeight:700,cursor:"pointer"}},t.label);})
      ),
      h("div",{style:{maxWidth:500,margin:"0 auto",padding:"10px 12px"}},content)
    ),
    h(Nav,{view:view,setView:setView,setSel:setSel})
  );
}

function App() {
  var vs = useState("ranking"); var view = vs[0]; var setView = vs[1];
  var as = useState(false); var adminAuth = as[0]; var setAdminAuth = as[1];
  var ss = useState("partidos"); var adminSection = ss[0]; var setAdminSection = ss[1];
  var sl = useState(null); var sel = sl[0]; var setSel = sl[1];
  var dt = useState("partidos"); var dTab = dt[0]; var setDTab = dt[1];
  var ar = useReducer(adR, INIT);
  var ad = ar[0]; var dispatch = ar[1];
  var loadedRef = useRef(false);
  var saving = useRef(false);
  var kr = ad.knockoutResults || {};

  var saveTimer = useRef(null);
  var GH_RAW = "https://raw.githubusercontent.com/luiseja/porra-mundial-2026/main/data.json?t=";
  var GH_API = "https://api.github.com/repos/luiseja/porra-mundial-2026/contents/data.json";

  // Load from GitHub on mount (public read, no token needed)
  useEffect(function() {
    if(loadedRef.current) return;
    loadedRef.current = true;
    fetch(GH_RAW + Date.now())
    .then(function(r){return r.json();})
    .then(function(data){
      if(data && typeof data === "object") {
        dispatch({type:"LOAD", data:data});
      }
    })
    .catch(function(){});
  }, []);

  // Save to GitHub on every change (debounced 2s) - token stored locally on admin device
  useEffect(function() {
    if(!loadedRef.current) return;
    if(saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(function() {
      var ghToken = localStorage.getItem("porra_gh_token");
      if(!ghToken) return;
      fetch(GH_API, {headers:{"Authorization":"token "+ghToken}})
      .then(function(r){return r.json();})
      .then(function(fileInfo){
        var sha = fileInfo.sha;
        var content = btoa(unescape(encodeURIComponent(JSON.stringify(ad))));
        return fetch(GH_API, {
          method: "PUT",
          headers: {"Authorization":"token "+ghToken,"Content-Type":"application/json"},
          body: JSON.stringify({message:"Update results",content:content,sha:sha})
        });
      })
      .catch(function(){});
    }, 2000);
  }, [ad]);

  var scores = useMemo(function() {
    return Object.entries(PD).map(function(x) {
      var res = calcPts(x[1], ad);
      return {name: x[0], total: res.total, breakdown: res.breakdown};
    }).sort(function(a, b) { return b.total - a.total; });
  }, [ad]);

  var md = Object.keys(ad.matches).length;

  if (view === "ranking" && !sel) {
    return h(RankingView, {scores:scores, md:md, setSel:setSel, setDTab:setDTab, view:view, setView:setView});
  }
  if (view === "ranking" && sel) {
    return h(DetailView, {sel:sel, ad:ad, kr:kr, dTab:dTab, setDTab:setDTab, setSel:setSel, view:view, setView:setView});
  }
  if (view === "admin") {
    if (!adminAuth) return h(AdminLogin, {setAdminAuth:setAdminAuth, view:view, setView:setView, setSel:setSel});
    return h(AdminView, {ad:ad, dispatch:dispatch, kr:kr, adminSection:adminSection, setAdminSection:setAdminSection, view:view, setView:setView, setSel:setSel});
  }

  if(view==="info"){
    var pts=[
      {ico:"⚽",title:"Fase de grupos",lines:["4 pts por acertar el signo (1/X/2)","+2 pts adicionales por resultado exacto"]},
      {ico:"📊",title:"Posición en grupos",lines:["4 pts por cada posición acertada de equipo en su grupo"]},
      {ico:"1/16",title:"Clasificados para 1/16",lines:["5 pts por cada equipo clasificado acertado"]},
      {ico:"1/8",title:"Clasificados para 1/8",lines:["10 pts por cada equipo clasificado acertado"]},
      {ico:"1/4",title:"Clasificados para cuartos",lines:["20 pts por cada equipo clasificado acertado"]},
      {ico:"1/2",title:"Clasificados para semis",lines:["40 pts por cada equipo clasificado acertado"]},
      {ico:"🏟️",title:"Finalistas",lines:["80 pts por cada finalista acertado"]},
      {ico:"🏆",title:"Campeón",lines:["160 pts por acertar el campeón"]},
      {ico:"🥉",title:"3er puesto",lines:["40 pts por acertar el 3er clasificado"]},
      {ico:"👟",title:"Botas",lines:["30 pts — Bota de Oro","20 pts — Bota de Plata","10 pts — Bota de Bronce"]},
      {ico:"🏅",title:"Balones",lines:["30 pts — Balón de Oro","20 pts — Balón de Plata","10 pts — Balón de Bronce"]}
    ];
    return h("div",{style:{display:"flex",flexDirection:"column",minHeight:"100vh"}},
      h("div",{style:{flex:1,overflowY:"auto"}},
        h("div",{style:{background:"linear-gradient(135deg,#111827,#1e3a5f)",padding:"26px 16px 18px",textAlign:"center"}},
          h("div",{style:{fontSize:40,marginBottom:4}},"📋"),
          h("h1",{style:{color:"#f59e0b",fontSize:21,fontWeight:900,margin:0}},"Premios y Puntos")
        ),
        h("div",{style:{maxWidth:500,margin:"0 auto",padding:"12px 12px 80px"}},
          h("div",{style:{background:"#1e3a5f",borderRadius:12,padding:"16px 18px",marginBottom:12,border:"1px solid #2a4a6a"}},
            h("div",{style:{fontWeight:900,color:"#f59e0b",fontSize:15,marginBottom:12,textAlign:"center"}},"🏆 Premios"),
            [
              {label:"Participantes",value:"26",color:"#c0d4e8"},
              {label:"Recaudación",value:"650 €",color:"#c0d4e8"},
              {label:"1er premio 🥇",value:"500 €",color:"#f59e0b"},
              {label:"2o premio 🥈",value:"125 €",color:"#9ca3af"},
              {label:"3er premio 🥉",value:"25 €",color:"#b45309"}
            ].map(function(row){
              return h("div",{key:row.label,style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:"1px solid #1e3a5f"}},
                h("span",{style:{fontSize:13,color:"#9ca3af"}},row.label),
                h("span",{style:{fontSize:14,fontWeight:700,color:row.color}},row.value)
              );
            })
          ),
          h("div",{style:{fontWeight:800,color:"#f5f5f5",fontSize:15,margin:"16px 0 10px",paddingTop:8,borderTop:"1px solid #1e2a3a"}},"Sistema de Puntos"),
          pts.map(function(s){return h("div",{key:s.title,style:{background:"#161f2e",borderRadius:12,padding:"14px 16px",marginBottom:8}},
            h("div",{style:{display:"flex",alignItems:"center",gap:10,marginBottom:8}},
              s.ico.length<=4?h("span",{style:{fontSize:22}},s.ico):h("span",{style:{background:"#1e3a5f",color:"#60a5fa",borderRadius:6,padding:"2px 8px",fontSize:12,fontWeight:700}},s.ico),
              h("span",{style:{fontWeight:700,color:"#f5f5f5",fontSize:14}},s.title)
            ),
            s.lines.map(function(l,i){return h("div",{key:i,style:{display:"flex",alignItems:"flex-start",gap:8,marginBottom:4}},
              h("span",{style:{color:"#f59e0b",fontSize:12}},"•"),
              h("span",{style:{color:"#c0d4e8",fontSize:13}},l)
            );})
          );})
        )
      ),
      h(Nav,{view:view,setView:setView,setSel:setSel})
    );
  }

  if(view==="stats"){return h(StatsView,{view:view,setView:setView,setSel:setSel});}
  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App, null));

</script>
</body>
</html>
